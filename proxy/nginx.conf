events {
    # Configuración básica de conexiones simultáneas
    worker_connections 1024;
}

http {
    # Definimos el grupo de servidores backend
    upstream backend_api {
        # Al usar el nombre del servicio 'api' definido en el docker-compose, 
        # el DNS interno de Docker se encarga automáticamente de repartir 
        # las peticiones (round-robin) entre las 3 réplicas disponibles.
        server api:3000; 
    }

    server {
        listen 80;

        # Todas las peticiones que empiecen con /api/ se mandan a las réplicas
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
		location / {
			proxy_pass http://app-web:5173;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
    }
}