events {
    worker_connections 1024;
}

http {
    # Nginx reparte las peticiones entre las IP de cada servicio (round-robin).
    # ponytail: grupo fijo para el TP; recargar Nginx al recrear o escalar réplicas.
    upstream backend_api {
        server api:3000 max_fails=1 fail_timeout=5s;
    }

    upstream frontend {
        server app-web:80 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        # No habilitar non_idempotent: reenviar un POST ya enviado podría duplicar tareas.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;

        location /api/ {
            proxy_pass http://backend_api;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
