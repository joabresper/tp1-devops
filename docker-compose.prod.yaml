services:
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  api:
    image: ${DOCKER_USERNAME:?Define DOCKER_USERNAME}/tp1-devops-api:latest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 3
    restart: always

  app-web:
    image: ${DOCKER_USERNAME:?Define DOCKER_USERNAME}/tp1-devops-app-web:latest
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  proxy:
    image: nginx:alpine
    container_name: proxy-reverso
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      app-web:
        condition: service_healthy
    restart: always

volumes:
  redis-data:
