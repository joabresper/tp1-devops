server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite identificar qué réplica del frontend entregó la respuesta.
    add_header X-Frontend-Instance $hostname always;

    location = /index.html {
        # Identifica el contenedor que entrega este HTML, sin una segunda petición.
        sub_filter 'content="Sin Nginx"' 'content="$hostname"';
        add_header X-Frontend-Instance $hostname always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
